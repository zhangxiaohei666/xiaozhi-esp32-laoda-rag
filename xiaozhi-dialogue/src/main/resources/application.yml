# ============================================================
# Dialogue 独立部署配置
# 与 server 共用的部分见 xiaozhi-common 的 application-common.yml
# （下面 spring.config.import 引入），本文件只放 dialogue 独有或与
# server 取值不同的项
# ============================================================

server:
  port: 8092

spring:
  config:
    import: classpath:application-common.yml

  # Flyway Migration 只在 server 执行，dialogue 不执行，避免多实例重复迁移
  flyway:
    enabled: false

  # 数据源配置（与 server 共享同一数据库）
  datasource:
    hikari:
      pool-name: DialogueHikariCP

  # 默认 dev（mvn spring-boot:run、java -jar、bin/*.sh、docker compose 都一样）；
  # 走生产要显式指定：SPRING_PROFILES_ACTIVE=prod、--spring.profiles.active=prod 或 bin/all.sh start prod
  profiles:
    active: dev

# ============================================================
# Sa-Token（共用字段见 application-common.yml）
# ============================================================
sa-token:
  jwt-secret-key: xiaozhi-esp32-server-java-jwt-secret-key

# ============================================================
# 图书馆座位查询工具（Function Calling）
#
# 默认关闭：enabled=false 时两个工具都不注册，模型不知道有这功能，
# 对现有能力零影响。要用时把 LIBRARY_ENABLED 设成 true。
#
# 登录与 token 由独立的浏览器守护进程负责（见 scripts/library-sidecar），
# 本进程只向它要 token，不碰 CAS 登录细节。
# 所有地址都走环境变量 —— 本项目要迁服务器，代码里不留硬编码。
#
# 注意前缀是 xiaozhi.library（与 application-common.yml 里其他扩展配置同属 xiaozhi 段），
# 早期是裸 library，2026-11-03 统一。只有 dialogue 进程用到，所以留在这个文件里。
# ============================================================
xiaozhi:
  stt:
    # dialogue 是真正接设备音频的进程，必须加载本地识别模型。
    # 这一项**特意放在这里而不是 application-common.yml**：
    # spring.config.import 导入的文档优先级高于导入它的文件，写在 common 里
    # 会给 server 也塞成 true（2026-11-04 实测踩过）。
    local-enabled: ${XIAOZHI_STT_LOCAL_ENABLED:true}
  library:
    enabled: ${LIBRARY_ENABLED:false}
    sidecar-url: ${LIBRARY_SIDECAR_URL:http://127.0.0.1:8790}
    base-url: ${LIBRARY_BASE_URL:https://zwyy.nyist.edu.cn}
    timeout-ms: ${LIBRARY_TIMEOUT_MS:5000}
    token-timeout-ms: ${LIBRARY_TOKEN_TIMEOUT_MS:3000}
