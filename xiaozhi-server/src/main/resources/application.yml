# ============================================================
# server 独立配置
# 与 dialogue 共用的部分见 xiaozhi-common 的 application-common.yml
# （下面 spring.config.import 引入），本文件只放 server 独有或与
# dialogue 取值不同的项
# ============================================================

server:
  port: 8091

# ============================================================
# 数据源配置
# ============================================================
spring:
  config:
    import: classpath:application-common.yml

  datasource:
    hikari:
      pool-name: ServerHikariCP

  # Flyway 数据库版本管理
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: false

  # JMX 配置
  jmx:
    enabled: false

  # 静态资源配置
  web:
    resources:
      add-mappings: true

  # 默认 dev（mvn spring-boot:run、java -jar、bin/*.sh、docker compose 都一样）；
  # 走生产要显式指定：SPRING_PROFILES_ACTIVE=prod、--spring.profiles.active=prod 或 bin/all.sh start prod
  profiles:
    active: dev

# ============================================================
# 邮件（注册与找回密码的验证码）
# 未配置时不发信，接口返回发送失败
# ============================================================
email:
  smtp:
    username: ${EMAIL_SMTP_USERNAME:}
    password: ${EMAIL_SMTP_PASSWORD:}

# ============================================================
# 小智扩展配置
# ============================================================
xiaozhi:
  # 安全用途（限流、封禁、登录审计）的客户端 IP 判定
  security:
    # 反向代理的 IP 或 CIDR，逗号分隔或 YAML 列表（如 172.16.0.0/12,10.0.0.0/8）
    # 留空表示不采信任何 X-Forwarded-For，只认 TCP 对端地址
    # 前面挂了 Nginx/LB 又不配，所有请求会被算成同一个网关 IP、共用一份限流额度
    trusted-proxies:
  communication:
    # OTA 下发的 WS 二进制帧版本：1=裸Opus，2=带时间戳(服务端AEC需要)，3=带长度头无时间戳
    websocket-protocol-version: 2

  stt:
    # server 进程是纯后台 API（管理界面、知识库、OTA 配置下发），不接设备音频，
    # 不需要本地语音识别模型。这里设 false 有两个好处：
    #   ① 省下约 230MB 的模型常驻内存，启动也快 2~4 秒
    #   ② 不去和 dialogue 抢 Vosk 模型文件的独占锁
    #      （Windows 上 Vosk 加载会独占打开模型目录，先启动的进程赢；
    #        2026-11-04 实测就是 server 抢到锁，导致 dialogue 完全识别不了语音）
    # 真正做识别的是 dialogue 进程，那边用 application-common.yml 的默认值 true。
    local-enabled: ${XIAOZHI_STT_LOCAL_ENABLED:false}

  # 图书馆座位的配置见 application-common.yml 的 xiaozhi.library 段。
  #
  # 这里曾经有一份同样的 library: 配置（2026-11-05 为了让网页聊天也能查座位而补）。
  # 2026-11-24 移走后此处不再保留：common 被两个进程 import，优先级也高于本文件，
  # 再留一份就是死配置，而且「两处各写一遍」正是之前 dialogue 漏配的根因。

# ============================================================
# SpringDoc OpenAPI 配置
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs

# ============================================================
# Sa-Token：JWT 秘钥（使用JWT Simple模式时必须配置，至少32位）
# 其余共用字段见 application-common.yml
# ============================================================
sa-token:
  jwt-secret-key: ${JWT_SECRET_KEY:xiaozhi-esp32-server-java-jwt-secret-key}

